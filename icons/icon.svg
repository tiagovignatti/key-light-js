<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="1" stop-color="#ffdca6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#1f1d1a"/>
    <rect x="87" y="128" width="338" height="256" rx="56" fill="#ffb24d" opacity=".6" filter="url(#glow)"/>
    <rect x="102" y="143" width="308" height="226" rx="40" fill="url(#panel)"/>
  </g>
</svg>
